<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="jonathandub.in">
<title>jonathandub.in</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100svh; display: grid; place-items: center; background: #fff; }
  .wanderer { position: fixed; left: 50%; top: 50%; width: max-content; transform: translate(-50%, -50%); will-change: left, top; }
  a { display: inline-block; color: #000; font: clamp(22px, 4.5vw, 36px) Courier, 'Courier New', monospace; text-decoration: none; animation: drift 13s ease-in-out infinite; }
  a:focus-visible { outline: 1px dotted currentColor; outline-offset: 10px; }
  @keyframes drift {
    0%, 100% { transform: translate(-7px, 4px) rotate(-3deg); }
    33% { transform: translate(9px, -7px) rotate(2deg); }
    66% { transform: translate(-3px, 8px) rotate(-1deg); }
  }
  @media (prefers-reduced-motion: reduce) { a { animation: none; } }
</style>
</head>
<body>
<div class="wanderer"><a href="https://jonathandub.in/">jonathandub.in</a></div>
<script>
  const wanderer = document.querySelector('.wanderer');
  const link = wanderer.querySelector('a');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let mouse = null;
  let x = innerWidth / 2, y = innerHeight / 2;
  let previousTime = 0;
  addEventListener('pointermove', event => {
    if (event.pointerType === 'mouse') mouse = { x: event.clientX, y: event.clientY };
  });
  document.addEventListener('pointerleave', () => { mouse = null; });
  addEventListener('blur', () => { mouse = null; });
  function move(time) {
    const dt = Math.min((time - previousTime) / 1000, .04);
    previousTime = time;
    const halfWidth = wanderer.offsetWidth / 2 + 20;
    const halfHeight = wanderer.offsetHeight / 2 + 24;
    if (mouse && !reducedMotion.matches && document.activeElement !== link) {
      const dx = x - mouse.x, dy = y - mouse.y;
      // Use an ellipse so the entire word, including its ends, dodges the cursor.
      const rx = halfWidth + 100, ry = halfHeight + 100;
      const distance = Math.hypot(dx / rx, dy / ry);
      if (distance < 1) {
        let directionX = dx / rx, directionY = dy / ry;
        if (distance < .01) { directionX = 0; directionY = mouse.y > innerHeight / 2 ? -1 : 1; }
        // At an edge, steer back into the available space instead of getting stuck.
        if ((x <= halfWidth + 5 && directionX < 0) || (x >= innerWidth - halfWidth - 5 && directionX > 0)) directionX = 0;
        if ((y <= halfHeight + 5 && directionY < 0) || (y >= innerHeight - halfHeight - 5 && directionY > 0)) directionY = 0;
        if (Math.hypot(directionX, directionY) < .01) directionY = y < innerHeight / 2 ? 1 : -1;
        const length = Math.hypot(directionX, directionY);
        const speed = 1600 * (1 - distance) + 650;
        x += directionX / length * speed * dt;
        y += directionY / length * speed * dt;
      }
    }
    x = Math.max(halfWidth, Math.min(innerWidth - halfWidth, x));
    y = Math.max(halfHeight, Math.min(innerHeight - halfHeight, y));
    wanderer.style.left = x + 'px';
    wanderer.style.top = y + 'px';
    requestAnimationFrame(move);
  }
  requestAnimationFrame(move);
</script>
</body>
</html>
